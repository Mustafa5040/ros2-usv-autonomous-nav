scan_to_scan_filter_chain:
  ros__parameters:
    filter1:
      name: speckle_filter
      type: laser_filters/LaserScanSpeckleFilter
      params:
        filter_type: 0 
        max_range: 2.0 
        max_range_difference: 0.2 
        # If a point doesn't have at least 4 neighbors within a 20 cm radius, delete it!
        filter_window: 4